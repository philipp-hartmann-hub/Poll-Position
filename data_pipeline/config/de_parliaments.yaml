# Poll-Position — Wahlrechts- und Parlamentkonfiguration (Deutschland)
# seats_total = gesetzliche Regel-/Mindestsitzzahl (ohne Überhang-/Ausgleichsmandate).
# Stand der Recherche: 2026-08-23
#
# Quellen (siehe auch sources_bibliography):
# - Die Bundeswahlleiterin: https://www.bundeswahlleiterin.de/
# - Deutscher Bundestag, Wahlrecht nach Reform 2023:
#   https://www.bundestag.de/parlament/wahlen/wahlrecht-inhalt-975000
# - Übersicht Landtagswahlrecht (Zusammenfassung der Landeswahlgesetze / Landeswahlleitungen):
#   https://www.wahlrecht.de/landtage/ (Aktualisierung laut Seite: 07.08.2026)

version: 1
as_of: "2026-08-23"

sources_bibliography:
  - "https://www.bundeswahlleiterin.de/ — Sitzverteilung, Glossar, BTW-Dokumentation"
  - "https://www.bundestag.de/parlament/wahlen/wahlrecht-inhalt-975000 — geltendes BT-Wahlrecht (630 Sitze, Zweitstimmendeckung, 5 %-Klausel; BVerfG 30.07.2024 zur Grundmandatsklausel)"
  - "https://www.wahlrecht.de/landtage/ — Übersicht Mandate, Sperrklauseln, Zuteilungsverfahren je Land (Primärquellen: jeweilige Landeswahlgesetze / Landeswahlleitungen)"
  - "Landeswahlleitungen der 16 Länder (amtliche Texte zu Sitzzahl und Sperrklausel)"

countries:
  - iso_code: DE
    name: Deutschland

election_systems:
  - key: de_bundestag_2023
    allocation_method: sainte_lague_schepers
    threshold_percent: 5.0
    seats_total: 630
    zweitstimmendeckung: true
    direct_seats: 299
    grundmandat_seats: 3  # BVerfG 30.07.2024: faktische Fortgeltung bis Neuregelung
    minority_exempt_party_ids: []  # nationale Minderheiten: Sperrklausel gilt nicht (BWG)
    notes: >
      Feste Bundestagsgröße 630 ab BTW 2025; Zweitstimmendeckung statt Überhang-/Ausgleich.
      5 %-Zweitstimmen-Hürde; nach BVerfG-Urteil vom 30.07.2024 gilt übergangsweise weiter,
      dass Parteien unter 5 % nur dann ausgeschlossen werden, wenn sie in weniger als drei
      Wahlkreisen die meisten Erststimmen errungen haben.
    sources:
      - "https://www.bundeswahlleiterin.de/service/glossar/s/sitzverteilung.html"
      - "https://www.bundestag.de/parlament/wahlen/wahlrecht-inhalt-975000"

