# Paneuropäische Wikipedia-Umfragequellen
# Politico Poll of Polls hat keine offene API; Europe Elects ist kostenpflichtig /
# nicht-kommerziell lizenziert — daher Wikipedia (CC BY-SA) als freie Alternative.
#
# Liste leicht erweiterbar: neuen Eintrag + optionalen Parser-Key ergänzen.

version: 1
attribution: "Quelle: Wikipedia-Mitwirkende, CC BY-SA"
license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
user_agent: "PollPosition/0.1 (https://github.com/philipp-hartmann-hub/Poll-Position; educational poll aggregator)"

