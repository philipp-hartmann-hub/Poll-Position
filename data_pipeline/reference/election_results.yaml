# Historische Wahlergebnisse (Zweitstimmen-/Listenanteile in Prozent)
# Quelle Bundestag: Die Bundeswahlleiterin, endgültiges Ergebnis BTW 2025
# https://www.bundeswahlleiterin.de/info/presse/mitteilungen/bundestagswahl-2025/29_25_endgueltiges-ergebnis.html
#
# party_id muss zu den IDs in surveys/survey_results passen (bzw. via Mapping).
# CDU+CSU zusätzlich als Aggregat de:cdu_csu für Umfragen, die Union zusammenfassen.

version: 1

elections:
