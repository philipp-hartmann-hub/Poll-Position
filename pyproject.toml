[project]
name = "poll-position"
version = "0.1.0"
description = "Umfragetracker und Analyse für Deutschland und Europa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.9.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
# Streamlit-UI lokal: uv sync --extra ui
ui = [
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "pydeck>=0.9.0",
]
# Pipeline / CI (Bronze-Parquet, warehouse-Schreiben): uv sync --extra pipeline
pipeline = [
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Vercel: `uv sync --no-editable` soll das Projekt NICHT als Wheel bauen
# (sonst scheitert hatchling an Repo-Nebenordnern). Quellcode liegt im Bundle.
[tool.uv]
package = false

[tool.hatch.build.targets.sdist]
include = [
    "analysis",
    "backend",
    "data_pipeline",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "analysis", "backend"]

[tool.hatch.build.targets.wheel.force-include]
"data_pipeline/config" = "data_pipeline/config"
"data_pipeline/reference" = "data_pipeline/reference"

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
