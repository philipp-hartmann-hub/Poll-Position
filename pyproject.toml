[project]
name = "poll-position"
version = "0.1.0"
description = "Umfragetracker und Analyse für Deutschland und Europa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.9.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "pydeck>=0.9.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "analysis", "app", "backend"]

[tool.hatch.build.targets.wheel.force-include]
"data_pipeline/config" = "data_pipeline/config"
"data_pipeline/reference" = "data_pipeline/reference"

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
