# Tägliche Daten-Pipeline: Connectors + Gold → MotherDuck, Static-JSON → Git (Vercel).
name: Daily Pipeline

on:
  schedule:
    # Täglich 05:15 UTC ≈ 06:15/07:15 MEZ/MESZ
    - cron: "15 5 * * *"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: data_pipeline.run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      # Secrets: Settings → Secrets and variables → Actions (nie im Repo committen)
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MotherDuck secrets
        run: |
          TOKEN="${MOTHERDUCK_TOKEN:-}"
          TOKEN="${TOKEN%$'\r'}"
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Nur Diagnose — Wert nicht nach GITHUB_ENV schreiben (Masking)
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret MOTHERDUCK_TOKEN fehlt. Anlegen unter Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "MOTHERDUCK_TOKEN gesetzt (Länge=${#TOKEN}, Präfix=${TOKEN:0:3}…)"
          if [[ "$TOKEN" == \"*\" || "$TOKEN" == \'*\' ]]; then
            echo "::warning::Token hat Anführungszeichen — warehouse.py entfernt sie; besser Secret ohne Quotes neu setzen."
          elif [[ "$TOKEN" != eyJ* ]]; then
            echo "::warning::Token beginnt nicht mit eyJ — oft falsch eingefügt (Quotes/Leerzeichen/falscher Wert)."
          fi
          if [ -z "${MOTHERDUCK_DATABASE:-}" ]; then
            echo "MOTHERDUCK_DATABASE nicht gesetzt — verwende Default poll_position"
            echo "MOTHERDUCK_DATABASE=poll_position" >> "$GITHUB_ENV"
          else
            echo "MOTHERDUCK_DATABASE ist gesetzt"
          fi
          echo "MotherDuck-Ziel konfiguriert (Token nicht geloggt)."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Run ETL + Gold refresh (Silver/Gold → MotherDuck)
        run: |
          set -euo pipefail
          echo "::group::Pipeline start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Static-Export nach web/public/data/ (IDs mit : → _ für Artifact/NTFS).
          # Bot-Commit danach → Vercel-Deploy liefert die JSONs als public/ aus.
          uv run python -m data_pipeline.run
          echo "::endgroup::"
          echo "Pipeline erfolgreich beendet."

      # Smoke vor Commit/Artifact: nur bei erfolgreichem Warehouse-Stand committen.
      - name: Smoke-check MotherDuck warehouse
        if: success()
        run: |
          uv run python - <<'PY'
          from data_pipeline.warehouse import (
              connect_warehouse,
              uses_motherduck,
              warehouse_connection_target,
          )

          if not uses_motherduck():
              raise SystemExit(
                  "FEHLER: MOTHERDUCK_TOKEN nicht aktiv — Silver/Gold würden lokal landen"
              )
          print("Ziel:", warehouse_connection_target(), "| MotherDuck: True")
          con = connect_warehouse()
          try:
              surveys = con.execute("SELECT COUNT(*) FROM surveys").fetchone()[0]
              results = con.execute("SELECT COUNT(*) FROM survey_results").fetchone()[0]
              avgs = con.execute("SELECT COUNT(*) FROM party_averages").fetchone()[0]
          finally:
              con.close()
          print(f"OK surveys={surveys} results={results} party_averages={avgs}")
          if surveys < 1 or results < 1:
              raise SystemExit("FEHLER: Silver-Tabellen leer — Connectoren ohne Daten?")
          if avgs < 1:
              raise SystemExit("FEHLER: Gold party_averages leer")
          PY

      - name: Commit Static-JSON-Export (Vercel liest daraus statt live MotherDuck)
        if: success()
        run: |
          git config user.name "poll-position-bot"
          git config user.email "actions@github.com"
          # Alt-Exports mit : im Pfad nie committen (Artifact/NTFS-ungültig)
          if [ -d web/public/data ]; then
            find web/public/data -depth -type d -name '*:*' -exec rm -rf {} +
          fi
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Static-Export."
          else
            git commit -m "chore: aktualisiere Static-JSON-Export [skip ci]"
            git push
          fi

      - name: Upload static JSON snapshot (Debug-Artifact)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: static-data-${{ github.run_id }}
          path: web/public/data/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload bronze artifacts only (Debug)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: |
            data/raw/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "::error::Tägliche Pipeline fehlgeschlagen. Logs oben prüfen (Secrets/Connector/Netzwerk)."
          echo "Lokal: MOTHERDUCK_TOKEN=… uv run python -m data_pipeline.run"
          exit 1
